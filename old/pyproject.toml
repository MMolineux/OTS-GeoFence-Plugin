[project]
name = "ots-geofence-plugin"
description = "Server-side GeoFence monitoring for OpenTakServer"
authors = [{name = "Matthew Molineux"}]
readme = "README.md"
license = "GPL-3.0-or-later"
dynamic = ["entry-points", "version"]

[project.urls]
Repository = "https://github.com/MMolineux/OTS-GeoFence-Plugin"
Documentation = "https://github.com/MMolineux/OTS-GeoFence-Plugin/wiki"

[tool.poetry]
include = [{path = "ots_geofence_plugin/ui/**/*", format = ["sdist", "wheel"]}]
version = "0.0.0"

[tool.poetry.dependencies]
opentakserver = ">=1.5.0"
python = ">=3.10, <3.14"

# This poetry plugin will automatically set your plugin's version based on git tags. Please use semantic versioning https://semver.org/
pika = "^1.3.2"
pyle38 = "^0.15.0"
pydantic = "^2.12.3"
[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
style = "semver"
dirty = false
pattern = "((?P<epoch>\\d+)!)?(?P<base>\\d+(\\.\\d+)*)"

[tool.poetry-dynamic-versioning.files."ots_geofence_plugin/__init__.py"]
persistent-substitution = true
initial-content = """
  # These version placeholders will be replaced later during substitution.
  __version__ = "0.0.0"
  __version_tuple__ = (0, 0, 0)
"""

[build-system]
requires = ["poetry-core>=2.0.0", "poetry-dynamic-versioning>=1.0.0,<2.0.0", "setuptools"]
build-backend = "poetry_dynamic_versioning.backend"

[project.entry-points.'opentakserver.plugin']
ots_geofence_plugin = 'ots_geofence_plugin.main:GeoFencePlugin'